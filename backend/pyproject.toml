[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# =============================================================================
# Project Metadata
# =============================================================================
[project]
name = "owasp-sentinel-backend"
version = "3.0.0"
description = "OWASP Sentinel v3 - Unified security scanning and vulnerability management platform"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OWASP Sentinel Contributors", email = "contribute@owasp-sentinel.io" },
]
keywords = ["security", "owasp", "vulnerability", "scanning", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--no-header",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring running services",
    "unit: marks tests that run without external services",
    "security: marks security-focused tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# Ruff — linting + formatting
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
    "ANN", # flake8-annotations
    "N",   # pep8-naming
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "ANN401", # Dynamically typed expressions (Any) are disallowed
    "S101",   # Use of assert detected — allowed in tests
    "B008",   # Do not perform function calls in default arguments (FastAPI Depends)
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S",     # security checks less strict in tests
    "ANN",   # annotations optional in tests
    "T20",   # print allowed in tests
    "PT",    # pytest style flexible in tests
]
"alembic/**/*.py" = ["ANN", "N999"]
"app/main.py" = ["T20"]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "celery"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# mypy — static type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
show_column_numbers = true
pretty = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "passlib.*",
    "jose.*",
    "minio.*",
    "meilisearch.*",
    "weasyprint.*",
    "reportlab.*",
    "structlog.*",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true

# =============================================================================
# setuptools
# =============================================================================
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "htmlcov*"]
